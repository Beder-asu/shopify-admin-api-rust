[package]
name = "shopify-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2.5"
base64 = "0.22"
reqwest = "0.11"
url = "2.5"
serde_json = "1.0"
rand = "0.8"
